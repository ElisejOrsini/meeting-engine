# Builds the demo course in demo/ with this repository's own action and
# publishes it to GitHub Pages. Runs on every push to main.
name: Deploy demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Jobs get only the permissions they need (see each job).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Build demo site with the engine action
        uses: ./
        with:
          content-dir: demo
          out-dir: _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # The github-pages environment only runs for main, and holds the
  # SUPABASE_SECRET_KEY secret, so the key is only used here. "actions: read"
  # lets the sync check that environment's branch rule before using the key.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Copy the demo's team list to the backend
        uses: ./sync
        with:
          content-dir: demo
          supabase-url: https://pgupsbgknzxrbkgreoqm.supabase.co
          supabase-secret-key: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
