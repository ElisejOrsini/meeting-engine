<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src {{CONNECT_SRC}}; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>{{COURSE_NAME}}</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-skip>Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="course-name" href="#/">{{COURSE_NAME}}</a>
      <div class="header-right">
        <nav class="site-nav" aria-label="Main">
          {{HOME_LINK}}<a href="#/" data-nav="meetings">Meetings</a>
          <a href="#/decisions" data-nav="decisions">Decisions</a>
          <a href="#/team" data-nav="team" hidden>Team</a>
        </nav>
        <div class="account" id="account" hidden></div>
      </div>
    </div>
  </header>
  <div class="wrap site-notice" id="site-notice" role="status"></div>
  <main id="main" class="wrap" tabindex="-1">
    <p class="muted">Loading…</p>
    <noscript><p>This site needs JavaScript to show meetings.</p></noscript>
  </main>
  <footer class="site-footer wrap">
    <span id="footer-text"></span>
  </footer>
</body>
</html>
