# Course settings. Every option is explained in the engine's docs:
# https://github.com/ElisejOrsini/meeting-engine/blob/v0.5.1/docs/content-format.md
#
# This file, like everything in this repository, is public.

name: "Course name"               # shown in the site header
description: |
  TA team meetings for Course name.

# Links shown on the start page (optional):
# links:
#   - title: Course website
#     url: https://example.org

# Sign-in with GitHub and survey answers (optional). Set this up with
# docs/new-course.md (step 5) in the engine. To switch it on, remove the "# "
# in front of each of the lines from "backend:" to the last username, and
# replace every REPLACE_... value (the check refuses them until you do).
# The URL and publishable key are public by design. Never put the secret key
# (sb_secret_...) here: it belongs in the github-pages environment secret.
# "members" lists the TA team's GitHub usernames: only they can sign in and
# answer surveys, and the list is public.
# backend:
#   url: https://REPLACE-WITH-PROJECT-URL.supabase.co   # Project URL
#   publishable_key: REPLACE_WITH_PUBLISHABLE_KEY        # Settings → API Keys
#   course_id: REPLACE_WITH_COURSE_ID                    # e.g. widgetry-2026; unique per course site
# members:
#   - REPLACE_WITH_GITHUB_USERNAME
