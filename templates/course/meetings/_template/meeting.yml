# Template for a new meeting. Folders starting with "_" are not published.
# To add a meeting: copy this folder to meetings/YYYY-MM-DD-short-name/
# (for example meetings/2026-11-17-late-submissions/) and fill it in.
# Only title and date are required; delete what you don't need.
# Every option: https://github.com/ElisejOrsini/meeting-engine/blob/v0.5.0/docs/content-format.md
title: Meeting title
date: 2026-01-31
time: "14:00"
duration: 60
location: Room or link
responses:
  reveal: anytime   # or: after_answering (others' answers to a question unlock once you've answered it)
  anonymous: false  # or: true (teammates see the answers, not who gave them; can't be undone)

# In-meeting tab (optional; can be added later).
agenda:
  - title: First agenda item
    minutes: 10
    question: first-question

# Pre-meeting tab: the questions to decide, with optional survey fields.
questions:
  - id: first-question
    text: What do we need to decide?
    details: Optional extra context, in Markdown.
    survey:
      - id: choice
        type: single        # single | multiple | text
        label: Your preference
        options:
          - Option A
          - Option B
      - id: comment
        type: text
        label: Comments
