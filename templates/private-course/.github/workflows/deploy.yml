# Builds this team's private meeting site (the website only, no content) with
# meeting-engine and publishes it on GitHub Pages, on every push to main.
#
# Engine version: change "@v0.5.0" below to get a newer engine, then push.
# No secrets are needed: the content is loaded after sign-in.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the site
        uses: ElisejOrsini/meeting-engine@v0.5.0
        with:
          content-dir: .
          out-dir: _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
